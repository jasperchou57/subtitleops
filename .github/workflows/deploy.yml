name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      # --- Cloudflare credentials (needed by cf-typegen in postinstall) ---
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # --- Client-side (VITE_*) env vars baked into the build ---
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      VITE_PAYMENT_PROVIDER: ${{ secrets.VITE_PAYMENT_PROVIDER }}
      VITE_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.VITE_STRIPE_PRICE_PRO_MONTHLY }}
      VITE_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_PRO_YEARLY }}
      VITE_STRIPE_PRICE_STUDIO_MONTHLY: ${{ secrets.VITE_STRIPE_PRICE_STUDIO_MONTHLY }}
      VITE_STRIPE_PRICE_STUDIO_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_STUDIO_YEARLY }}
      VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
      # --- Worker runtime secrets ---
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        run: |
          : "${BETTER_AUTH_SECRET:?Missing BETTER_AUTH_SECRET GitHub secret}"
          : "${STRIPE_SECRET_KEY:?Missing STRIPE_SECRET_KEY GitHub secret}"
          : "${STRIPE_WEBHOOK_SECRET:?Missing STRIPE_WEBHOOK_SECRET GitHub secret}"

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg betterAuthSecret "$BETTER_AUTH_SECRET" \
            --arg stripeSecretKey "$STRIPE_SECRET_KEY" \
            --arg stripeWebhookSecret "$STRIPE_WEBHOOK_SECRET" \
            '{
              BETTER_AUTH_SECRET: $betterAuthSecret,
              STRIPE_SECRET_KEY: $stripeSecretKey,
              STRIPE_WEBHOOK_SECRET: $stripeWebhookSecret
            }' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
