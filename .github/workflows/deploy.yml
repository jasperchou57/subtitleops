name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      # --- Cloudflare credentials (needed by cf-typegen in postinstall) ---
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # --- Client-side (VITE_*) env vars baked into the build ---
      VITE_BASE_URL: https://subtitleops.com
      VITE_MAIL_ENABLED: ${{ vars.VITE_MAIL_ENABLED || 'false' }}
      VITE_PAYMENT_PROVIDER: stripe
      VITE_STRIPE_PRICE_PRO_MONTHLY: price_1Ttph8LqS2UAWoIc0jkIjKDQ
      VITE_STRIPE_PRICE_PRO_YEARLY: price_1TtpiwLqS2UAWoIc8rLz3yjB
      VITE_STRIPE_PRICE_STUDIO_MONTHLY: price_1TtpkJLqS2UAWoIc81hvQWK5
      VITE_STRIPE_PRICE_STUDIO_YEARLY: price_1TtplrLqS2UAWoIc88IdfmRF
      VITE_GOOGLE_ANALYTICS_ID: G-3RKDT74KDZ
      VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED || 'false' }}
      VITE_ADSENSE_CLIENT_ID: ca-pub-9498208038262605
      # --- Worker runtime secrets ---
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Repository secret names cannot use GitHub's reserved GITHUB_ prefix.
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      EXPECTED_STRIPE_ACCOUNT_ID: acct_1Ttp7cLqS2UAWoIc

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate production configuration
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID GitHub secret}"
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN GitHub secret}"
          : "${BETTER_AUTH_SECRET:?Missing BETTER_AUTH_SECRET GitHub secret}"
          : "${GOOGLE_CLIENT_ID:?Missing GOOGLE_CLIENT_ID GitHub secret}"
          : "${GOOGLE_CLIENT_SECRET:?Missing GOOGLE_CLIENT_SECRET GitHub secret}"
          : "${GITHUB_CLIENT_ID:?Missing OAUTH_GITHUB_CLIENT_ID GitHub secret}"
          : "${GITHUB_CLIENT_SECRET:?Missing OAUTH_GITHUB_CLIENT_SECRET GitHub secret}"
          : "${STRIPE_SECRET_KEY:?Missing STRIPE_SECRET_KEY GitHub secret}"
          : "${STRIPE_WEBHOOK_SECRET:?Missing STRIPE_WEBHOOK_SECRET GitHub secret}"

          case "$STRIPE_SECRET_KEY" in
            sk_live_*) ;;
            *)
              echo "STRIPE_SECRET_KEY must be a Stripe live-mode secret key."
              exit 1
              ;;
          esac
          case "$STRIPE_WEBHOOK_SECRET" in
            whsec_*) ;;
            *)
              echo "STRIPE_WEBHOOK_SECRET must be a Stripe webhook signing secret."
              exit 1
              ;;
          esac

          stripe_account_id="$(
            curl --fail --silent --show-error \
              --user "$STRIPE_SECRET_KEY:" \
              https://api.stripe.com/v1/account |
              jq -r '.id // empty'
          )"
          if [ "$stripe_account_id" != "$EXPECTED_STRIPE_ACCOUNT_ID" ]; then
            echo "Stripe key belongs to '$stripe_account_id', expected SubtitleOps account '$EXPECTED_STRIPE_ACCOUNT_ID'."
            exit 1
          fi

          verify_price() {
            price_id="$1"
            expected_amount="$2"
            expected_interval="$3"
            if ! curl --fail --silent --show-error \
              --user "$STRIPE_SECRET_KEY:" \
              "https://api.stripe.com/v1/prices/$price_id" |
              jq -e \
                --argjson amount "$expected_amount" \
                --arg interval "$expected_interval" \
                '.active == true and .unit_amount == $amount and .currency == "usd" and .recurring.interval == $interval' \
                >/dev/null; then
              echo "Stripe price '$price_id' is missing, inactive, or does not match the expected amount and interval."
              exit 1
            fi
          }

          verify_price "$VITE_STRIPE_PRICE_PRO_MONTHLY" 999 month
          verify_price "$VITE_STRIPE_PRICE_PRO_YEARLY" 7900 year
          verify_price "$VITE_STRIPE_PRICE_STUDIO_MONTHLY" 2499 month
          verify_price "$VITE_STRIPE_PRICE_STUDIO_YEARLY" 19900 year

          webhook_endpoint="$(
            curl --fail --silent --show-error \
              --user "$STRIPE_SECRET_KEY:" \
              'https://api.stripe.com/v1/webhook_endpoints?limit=100' |
              jq --arg url 'https://subtitleops.com/api/webhooks/stripe' \
                '[.data[] | select(.url == $url and .status == "enabled")][0]'
          )"
          if [ "$webhook_endpoint" = "null" ]; then
            echo "Enabled SubtitleOps Stripe webhook endpoint was not found."
            exit 1
          fi
          for event_type in \
            checkout.session.completed \
            checkout.session.async_payment_succeeded \
            checkout.session.async_payment_failed \
            checkout.session.expired \
            customer.subscription.created \
            customer.subscription.updated \
            customer.subscription.deleted \
            invoice.paid \
            invoice.payment_failed \
            refund.created \
            charge.refunded \
            charge.dispute.created \
            charge.dispute.closed \
            charge.dispute.funds_reinstated; do
            if ! jq -e --arg event_type "$event_type" \
              '.enabled_events | index("*") != null or index($event_type) != null' \
              >/dev/null <<<"$webhook_endpoint"; then
              echo "Stripe webhook is not subscribed to '$event_type'."
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm db:migrate:remote

      - name: Build
        run: VITE_MAIL_ENABLED="${VITE_MAIL_ENABLED:-false}" pnpm build

      - name: Deploy to Cloudflare Workers
        run: |
          if [ "${VITE_MAIL_ENABLED:-false}" = "true" ]; then
            : "${RESEND_API_KEY:?Missing RESEND_API_KEY GitHub secret while mail is enabled}"
          fi

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg betterAuthSecret "$BETTER_AUTH_SECRET" \
            --arg googleClientId "$GOOGLE_CLIENT_ID" \
            --arg googleClientSecret "$GOOGLE_CLIENT_SECRET" \
            --arg githubClientId "$GITHUB_CLIENT_ID" \
            --arg githubClientSecret "$GITHUB_CLIENT_SECRET" \
            --arg resendApiKey "$RESEND_API_KEY" \
            --arg stripeSecretKey "$STRIPE_SECRET_KEY" \
            --arg stripeWebhookSecret "$STRIPE_WEBHOOK_SECRET" \
            '{
              BETTER_AUTH_SECRET: $betterAuthSecret,
              GOOGLE_CLIENT_ID: $googleClientId,
              GOOGLE_CLIENT_SECRET: $googleClientSecret,
              GITHUB_CLIENT_ID: $githubClientId,
              GITHUB_CLIENT_SECRET: $githubClientSecret,
              STRIPE_SECRET_KEY: $stripeSecretKey,
              STRIPE_WEBHOOK_SECRET: $stripeWebhookSecret
            } + (
              if $resendApiKey == ""
              then {}
              else {RESEND_API_KEY: $resendApiKey}
              end
            )' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"

      - name: Verify deployed Worker
        run: |
          workers_subdomain="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" |
              jq -r '.result.subdomain // empty'
          )"
          : "${workers_subdomain:?Unable to determine the Cloudflare workers.dev subdomain}"
          pnpm verify:deployment -- "https://subtitleops.$workers_subdomain.workers.dev"
